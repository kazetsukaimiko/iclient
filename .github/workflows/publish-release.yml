name: Publish the release

on:
  push:
    tags:
      - "*.*.*"

# Jobs below set their own permissions. packages: write exists only on deploy.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main:refs/remotes/origin/main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check the tag, its ancestry and the packages environment
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/release/check_release.py

      - name: Verify the reactor
        run: ./mvnw -B verify

      - name: Credential-free publish check
        env:
          TAG: "0.1.0"
        run: bash .github/release/check_local_publish.sh

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: packages
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Publish the reactor
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/release/publish_release.sh
